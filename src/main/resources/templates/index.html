<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Frota - Motos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .header-title {
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }

        /* Estilo dos Cartões */
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            transition: transform 0.3s ease;
        }

        /* Estilo dos Inputs */
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e0e4e8;
            background-color: #fcfcfc;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
            border-color: #4361ee;
            background-color: #fff;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #5a6a85;
            margin-bottom: 6px;
        }

        /* Botões Customizados */
        .btn-primary-custom {
            background: linear-gradient(135deg, #4361ee 0%, #3f37c9 100%);
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            transition: all 0.3s ease;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
            background: linear-gradient(135deg, #3f37c9 0%, #3a0ca3 100%);
        }

        .btn-danger-custom {
            background: #ef233c;
            border: none;
            border-radius: 8px;
            padding: 6px 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-danger-custom:hover {
            background: #d90429;
            transform: scale(1.05);
        }

        /* Tabela Customizada */
        .table-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background: #fff;
        }

        table {
            margin-bottom: 0 !important;
        }

        thead.bg-dark-custom {
            background: #2b2d42;
            color: #fff;
        }

        thead.bg-dark-custom th {
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 15px;
            border: none;
        }

        tbody td {
            padding: 15px;
            vertical-align: middle;
            color: #4a5568;
            border-bottom: 1px solid #f0f2f5;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <div class="row mb-5">
        <div class="col-12 text-center">
            <h2 class="header-title">
                <i class="fa-solid fa-motorcycle text-primary me-2" style="color: #4361ee !important;"></i>
                Gestão de Frota Premium
            </h2>
            <p class="text-muted">Controle e registro de motocicletas do sistema</p>
        </div>
    </div>

    <div class="row justify-content-center mb-5">
        <div class="col-lg-10">
            <div class="card card-custom p-4 p-md-5">
                <h5 class="mb-4 text-dark"><i class="fa-solid fa-plus-circle me-2 text-primary"></i>Nova Moto</h5>

                <form th:action="@{/salvar}" th:object="${novaMoto}" method="post" class="row g-4">
                    <div class="col-md-3">
                        <label class="form-label"><i class="fa-solid fa-tag me-1"></i> Marca</label>
                        <input type="text" class="form-control" th:field="*{marca}" placeholder="Ex: Honda" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label"><i class="fa-solid fa-file-signature me-1"></i> Modelo</label>
                        <input type="text" class="form-control" th:field="*{modelo}" placeholder="Ex: CG 160" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label"><i class="fa-regular fa-calendar me-1"></i> Ano</label>
                        <input type="number" class="form-control" th:field="*{ano}" placeholder="Ex: 2024" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label"><i class="fa-solid fa-id-card me-1"></i> Placa</label>
                        <input type="text" class="form-control" th:field="*{placa}" placeholder="ABC-1234" required style="text-transform: uppercase;">
                    </div>
                    <div class="col-12 text-end mt-4 pt-2">
                        <button type="submit" class="btn btn-primary-custom text-white">
                            <i class="fa-solid fa-check me-2"></i>Registrar Moto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <h5 class="mb-3 text-dark"><i class="fa-solid fa-list me-2 text-primary"></i>Frota Cadastrada</h5>

            <div class="table-container">
                <table class="table table-borderless table-hover">
                    <thead class="bg-dark-custom">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano</th>
                        <th>Placa</th>
                        <th class="text-center pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="moto : ${motos}">
                        <td class="ps-4 fw-bold" th:text="${'#' + moto.id}"></td>
                        <td th:text="${moto.marca}"></td>
                        <td th:text="${moto.modelo}"></td>
                        <td th:text="${moto.ano}"></td>
                        <td><span class="badge bg-light text-dark border border-secondary rounded-pill px-3 py-2" th:text="${moto.placa}"></span></td>
                        <td class="text-center pe-4">
                            <a th:href="@{/deletar/{id}(id=${moto.id})}" class="btn btn-danger-custom text-white shadow-sm" title="Excluir">
                                <i class="fa-solid fa-trash-can"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(motos)}">
                        <td colspan="6" class="text-center py-5">
                            <div class="text-muted">
                                <i class="fa-solid fa-box-open fa-3x mb-3 text-light"></i>
                                <h5>Nenhuma moto registrada</h5>
                                <p class="mb-0">Utilize o formulário acima para adicionar o primeiro veículo.</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
</body>
</html>
