<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Frota - Motos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Cadastro de Motos</h2>

    <div class="card p-4 mb-5 shadow-sm">
        <form th:action="@{/salvar}" th:object="${novaMoto}" method="post" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" th:field="*{marca}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Modelo</label>
                <input type="text" class="form-control" th:field="*{modelo}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Ano</label>
                <input type="number" class="form-control" th:field="*{ano}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Placa</label>
                <input type="text" class="form-control" th:field="*{placa}" required>
            </div>
            <div class="col-12 text-end mt-4">
                <button type="submit" class="btn btn-primary px-4">Salvar Moto</button>
            </div>
        </form>
    </div>

    <h4 class="mb-3">Motos Cadastradas</h4>
    <div class="card shadow-sm">
        <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Placa</th>
                <th class="text-center">Ação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="moto : ${motos}">
                <td th:text="${moto.id}"></td>
                <td th:text="${moto.marca}"></td>
                <td th:text="${moto.modelo}"></td>
                <td th:text="${moto.ano}"></td>
                <td th:text="${moto.placa}"></td>
                <td class="text-center">
                    <a th:href="@{/deletar/{id}(id=${moto.id})}" class="btn btn-danger btn-sm">Excluir</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(motos)}">
                <td colspan="6" class="text-center text-muted p-3">Nenhuma moto cadastrada no sistema.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
